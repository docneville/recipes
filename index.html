<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morse Recipes</title>
  <link rel="stylesheet" href="recipes.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>🍲 Morse Recipes</h1>
    <p id="tagline">Sharing the Morse family's favorite recipes — no ads, no clutter, just the good stuff.</p>
  </header>
  <main>
    <div class="card" id="signedOutCard">
      <button type="button" id="googleSignInBtn" class="rc-btn-secondary" style="width:100%; display:flex; align-items:center; justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 48 48" style="margin-right:10px; flex-shrink:0;">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>
      <p id="errorBox" class="error" style="display:none; margin-top: 0.75rem;"></p>
    </div>

    <div class="card" id="signedInCard" style="display:none; text-align:center;">
      <h2 id="welcomeMessage">Welcome!</h2>
      <p><a href="app.html" class="rc-btn-primary">Your recipes</a></p>
      <p style="margin-top: 1rem;"><a href="#" id="signOutLink">Sign out</a></p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://hhkxmuxcmjzvpjvctgqk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhoa3htdXhjbWp6dnBqdmN0Z3FrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNTIzMjksImV4cCI6MjEwMjkyODMyOX0.ZnC7cGeydW2DDNZtwn1gUownpI2gWm1U2m2s_KQmXw0";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const signedOutCard = document.getElementById("signedOutCard");
    const signedInCard = document.getElementById("signedInCard");
    const googleSignInBtn = document.getElementById("googleSignInBtn");
    const errorBox = document.getElementById("errorBox");
    const signOutLink = document.getElementById("signOutLink");

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
    }

    // Same as app.html's ensureProfile() - kept here too since this page
    // is now the OAuth landing target and needs first_name for the
    // welcome message right away, without a round-trip through app.html.
    async function ensureProfile(user) {
      const meta = user.user_metadata || {};
      const { data: existing } = await sb.from("profiles").select("id, first_name, last_name, avatar_url").eq("id", user.id).maybeSingle();

      if (!existing) {
        const { data: created } = await sb.from("profiles").insert({
          id: user.id,
          first_name: meta.given_name || meta.full_name?.split(" ")[0] || null,
          last_name: meta.family_name || null,
          avatar_url: meta.avatar_url || meta.picture || null,
        }).select("first_name").single();
        return created?.first_name || null;
      }

      const patch = {};
      if (!existing.avatar_url && (meta.avatar_url || meta.picture)) patch.avatar_url = meta.avatar_url || meta.picture;
      if (!existing.first_name && (meta.given_name || meta.full_name)) patch.first_name = meta.given_name || meta.full_name?.split(" ")[0];
      if (!existing.last_name && meta.family_name) patch.last_name = meta.family_name;
      if (Object.keys(patch).length > 0) {
        await sb.from("profiles").update(patch).eq("id", user.id);
        return patch.first_name || existing.first_name || null;
      }
      return existing.first_name || null;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const { data: { session } } = await sb.auth.getSession();

      if (!session) {
        signedOutCard.style.display = "block";
        signedInCard.style.display = "none";
        return;
      }

      const firstName = await ensureProfile(session.user);
      const displayName = firstName || session.user.email.split("@")[0];

      document.getElementById("welcomeMessage").textContent = `Welcome, ${displayName}!`;
      signedOutCard.style.display = "none";
      signedInCard.style.display = "block";
    });

    googleSignInBtn.addEventListener("click", async () => {
      errorBox.style.display = "none";
      googleSignInBtn.disabled = true;

      const { error } = await sb.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: `${window.location.origin}/` },
      });

      // On success, Supabase redirects the whole page to Google - this
      // line only runs if signInWithOAuth itself failed to even start.
      if (error) {
        showError(error.message);
        googleSignInBtn.disabled = false;
      }
    });

    signOutLink.addEventListener("click", async (e) => {
      e.preventDefault();
      await sb.auth.signOut();
      window.location.reload();
    });
  </script>
</body>
</html>
