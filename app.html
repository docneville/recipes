<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morse Recipes</title>
  <link rel="stylesheet" href="recipes.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="nav.js"></script>
</head>
<body>
  <header>
    <h1>🍲 Morse Recipes</h1>
  </header>
  <main>
    <div style="text-align:center; margin-bottom: 1rem; display:flex; gap:0.5rem; justify-content:center;">
      <a href="add-recipe.html" class="rc-btn-primary">+ Add recipe</a>
      <a href="import.html" class="rc-btn-primary" style="background:#fff; color:var(--rc-accent-dark); border:1px solid var(--rc-border);">📷 Import from photo</a>
    </div>

    <div class="rc-scope-toggle" id="scopeToggle">
      <button type="button" class="rc-scope-btn active" data-scope="mine">My Recipes</button>
      <button type="button" class="rc-scope-btn" data-scope="all">All Recipes</button>
    </div>

    <div class="rc-toolbar">
      <input type="search" id="searchInput" placeholder="Search recipes…">
    </div>

    <div class="rc-tag-filter" id="tagFilter"></div>

    <div id="recipeList"></div>
    <p id="emptyState" class="rc-empty" style="display:none;">No recipes yet — add your first one.</p>
  </main>

  <script>
    const SUPABASE_URL = "https://hhkxmuxcmjzvpjvctgqk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhoa3htdXhjbWp6dnBqdmN0Z3FrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNTIzMjksImV4cCI6MjEwMjkyODMyOX0.ZnC7cGeydW2DDNZtwn1gUownpI2gWm1U2m2s_KQmXw0";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const searchInput = document.getElementById("searchInput");
    const tagFilter = document.getElementById("tagFilter");
    const recipeList = document.getElementById("recipeList");
    const emptyState = document.getElementById("emptyState");
    const scopeToggle = document.getElementById("scopeToggle");

    let allRecipes = [];
    let allTags = [];
    let activeTagId = null;
    let scope = "mine"; // or "all" - recipes-b28.2
    let currentUserId = null;

    async function requireSession() {
      const { data: { session }, error } = await sb.auth.getSession();
      if (error || !session) {
        window.location.href = "index.html";
        throw new Error("Session expired - redirecting to sign in.");
      }
      return session;
    }

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = allRecipes.filter(r => {
        const matchesQuery = !query || r.title.toLowerCase().includes(query);
        const matchesTag = !activeTagId || r.tagIds.has(activeTagId);
        return matchesQuery && matchesTag;
      });

      if (filtered.length === 0) {
        recipeList.innerHTML = "";
        emptyState.style.display = "block";
        emptyState.textContent = allRecipes.length === 0
          ? "No recipes yet — add your first one."
          : "No recipes match your search.";
        return;
      }

      emptyState.style.display = "none";
      recipeList.innerHTML = filtered.map(r => {
        const metaParts = [];
        if (r.prep_minutes || r.cook_minutes) {
          const total = (r.prep_minutes || 0) + (r.cook_minutes || 0);
          metaParts.push(`${total} min`);
        }
        if (r.servings) metaParts.push(`Serves ${r.servings}`);

        const tagsHtml = r.tagNames.length
          ? `<div class="rc-recipe-tags">${r.tagNames.map(t => `<span>${escapeHtml(t)}</span>`).join("")}</div>`
          : "";

        const thumbHtml = r.thumbUrl ? `<img class="rc-recipe-thumb" src="${r.thumbUrl}" alt="">` : "";

        return `
          <a class="rc-recipe-card ${r.thumbUrl ? "rc-recipe-card--has-thumb" : ""}" href="recipe.html?id=${r.id}">
            ${thumbHtml}
            <div class="rc-recipe-card-body">
              <h3>${escapeHtml(r.title)}</h3>
              ${metaParts.length ? `<div class="rc-recipe-meta">${metaParts.join(" · ")}</div>` : ""}
              ${tagsHtml}
            </div>
          </a>
        `;
      }).join("");
    }

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s;
      return div.innerHTML;
    }

    function renderTagFilter() {
      if (allTags.length === 0) {
        tagFilter.innerHTML = "";
        return;
      }
      tagFilter.innerHTML = allTags.map(t => `
        <button type="button" class="rc-tag-chip ${t.id === activeTagId ? "active" : ""}" data-tag-id="${t.id}">${escapeHtml(t.name)}</button>
      `).join("");

      tagFilter.querySelectorAll(".rc-tag-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.tagId;
          activeTagId = activeTagId === id ? null : id;
          renderTagFilter();
          render();
        });
      });
    }

    async function loadData(userId) {
      // recipes-b28.2: "mine" filters by owner client-side via .eq();
      // "all" leaves it unfiltered and relies on the RLS policy that now
      // permits any approved user to SELECT all recipes. Tags are always
      // fetched unfiltered - they're a shared family vocabulary now, not
      // per-user, so the filter chips should reflect everyone's tags
      // regardless of which scope is showing.
      let recipesQuery = sb.from("recipes").select("id, user_id, title, prep_minutes, cook_minutes, servings, created_at, main_photo_id").order("created_at", { ascending: false });
      if (scope === "mine") recipesQuery = recipesQuery.eq("user_id", userId);

      // recipes-ddd: recipe_photos fetched unfiltered (same "select all,
      // group client-side" pattern as tags/recipe_tags above, relying on
      // RLS's is_approved() gate) rather than a separate per-recipe
      // query - one round trip for however many cards are visible.
      // Ordered oldest-first so, for a recipe with no main_photo_id set,
      // the first entry in its group is the correct "first uploaded"
      // fallback without any extra sorting.
      const [{ data: recipes, error: rErr }, { data: tags, error: tErr }, { data: recipeTags, error: rtErr }, { data: photos, error: pErr }] = await Promise.all([
        recipesQuery,
        sb.from("tags").select("id, name").order("name", { ascending: true }),
        sb.from("recipe_tags").select("recipe_id, tag_id"),
        sb.from("recipe_photos").select("id, recipe_id, storage_path").order("created_at", { ascending: true }),
      ]);

      if (rErr || tErr || rtErr || pErr) {
        console.error(rErr || tErr || rtErr || pErr);
        recipeList.innerHTML = `<p class="error">Failed to load recipes.</p>`;
        return;
      }

      allTags = tags || [];

      const tagsByRecipe = {};
      (recipeTags || []).forEach(rt => {
        if (!tagsByRecipe[rt.recipe_id]) tagsByRecipe[rt.recipe_id] = [];
        tagsByRecipe[rt.recipe_id].push(rt.tag_id);
      });
      const tagNameById = {};
      allTags.forEach(t => { tagNameById[t.id] = t.name; });

      const photosByRecipe = {};
      (photos || []).forEach(p => {
        if (!photosByRecipe[p.recipe_id]) photosByRecipe[p.recipe_id] = [];
        photosByRecipe[p.recipe_id].push(p);
      });

      allRecipes = (recipes || []).map(r => {
        const tagIds = tagsByRecipe[r.id] || [];
        const recipePhotos = photosByRecipe[r.id] || [];
        const thumbPhoto = recipePhotos.find(p => p.id === r.main_photo_id) || recipePhotos[0] || null;
        return {
          ...r,
          tagIds: new Set(tagIds),
          tagNames: tagIds.map(id => tagNameById[id]).filter(Boolean),
          thumbStoragePath: thumbPhoto?.storage_path || null,
          thumbUrl: null,
        };
      });

      const withThumbs = allRecipes.filter(r => r.thumbStoragePath);
      if (withThumbs.length > 0) {
        const signedUrls = await Promise.all(
          withThumbs.map(r => sb.storage.from("recipe-photos").createSignedUrl(r.thumbStoragePath, 3600))
        );
        withThumbs.forEach((r, i) => { r.thumbUrl = signedUrls[i]?.data?.signedUrl || null; });
      }

      renderTagFilter();
      render();
    }

    // recipes-022.1: ensure a profiles row exists for whoever just signed
    // in, regardless of method (Google or email+password). Google gives us
    // given_name/family_name/picture via user_metadata on first sign-in;
    // email sign-in has nothing to seed with, so it just creates an empty
    // row for profile.html to fill in later. Mirrors Houstory's app.html.
    async function ensureProfile(user) {
      const meta = user.user_metadata || {};
      const { data: existing } = await sb.from("profiles").select("id, first_name, last_name, avatar_url").eq("id", user.id).maybeSingle();

      if (!existing) {
        await sb.from("profiles").insert({
          id: user.id,
          first_name: meta.given_name || meta.full_name?.split(" ")[0] || null,
          last_name: meta.family_name || null,
          avatar_url: meta.avatar_url || meta.picture || null,
        });
        return;
      }

      const patch = {};
      if (!existing.avatar_url && (meta.avatar_url || meta.picture)) patch.avatar_url = meta.avatar_url || meta.picture;
      if (!existing.first_name && (meta.given_name || meta.full_name)) patch.first_name = meta.given_name || meta.full_name?.split(" ")[0];
      if (!existing.last_name && meta.family_name) patch.last_name = meta.family_name;
      if (Object.keys(patch).length > 0) {
        await sb.from("profiles").update(patch).eq("id", user.id);
      }
    }

    searchInput.addEventListener("input", render);

    scopeToggle.querySelectorAll(".rc-scope-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (btn.dataset.scope === scope) return;
        scope = btn.dataset.scope;
        scopeToggle.querySelectorAll(".rc-scope-btn").forEach(b => b.classList.toggle("active", b.dataset.scope === scope));
        activeTagId = null; // clear a tag filter that may not apply to the new scope's recipes
        RecipesNav.setBreadcrumbs([{ label: "Home", href: "index.html" }, { label: scope === "mine" ? "Your Recipes" : "All Recipes" }]);
        await loadData(currentUserId);
      });
    });

    document.addEventListener("DOMContentLoaded", async () => {
      let session;
      try {
        session = await requireSession();
      } catch {
        return;
      }
      currentUserId = session.user.id;
      await RecipesNav.init({ sb, breadcrumbs: [{ label: "Home", href: "index.html" }, { label: "Your Recipes" }] });
      await ensureProfile(session.user);
      await loadData(currentUserId);
    });
  </script>
</body>
</html>
