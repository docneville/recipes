<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morse Recipes</title>
  <link rel="stylesheet" href="recipes.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="nav.js"></script>
</head>
<body>
  <header>
    <h1>🍲 Morse Recipes</h1>
  </header>
  <main>
    <div class="card" id="recipeCard" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:0.75rem;">
        <h2 id="recipeTitle" style="margin:0;"></h2>
        <button type="button" id="shareBtn" class="rc-share-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          Share
        </button>
      </div>
      <p id="recipeByline" style="color: var(--rc-muted); font-size: 0.9rem;"></p>
      <p id="shareStatus" style="display:none; color: var(--rc-muted); font-size: 0.85rem;"></p>
      <p id="recipeDescription"></p>

      <div class="rc-significance" id="significanceSection" style="display:none;">
        <p class="rc-significance-label">💛 Why This Recipe Matters</p>
        <p id="recipeSignificance"></p>
      </div>

      <div class="rc-detail-meta" id="recipeMeta"></div>
      <div class="rc-recipe-tags" id="recipeTags"></div>

      <h3>Ingredients</h3>
      <ul class="rc-ingredients" id="ingredientsList"></ul>

      <h3>Steps</h3>
      <ol class="rc-steps" id="stepsList"></ol>

      <h3>Photos</h3>
      <div id="finishedPhotosGrid" class="rc-photo-grid"></div>
      <p id="finishedPhotosEmpty" style="display:none; color: var(--rc-muted); font-size:0.85rem;">No photos yet.</p>

      <div id="addPhotoForm" style="display:none; margin-top:0.75rem;">
        <label for="newPhotoFile">Add a photo</label>
        <input type="file" id="newPhotoFile" accept="image/*">
        <label for="newPhotoDescription">Description (optional)</label>
        <input type="text" id="newPhotoDescription" placeholder="e.g. First attempt - a bit too salty!">
        <button type="button" id="addPhotoBtn">Add photo</button>
        <p id="photoUploadError" class="error" style="display:none;"></p>
      </div>

      <div id="notesSection" style="display:none;">
        <h3>Notes</h3>
        <p id="recipeNotes"></p>
      </div>

      <div id="sourcePhotosSection" style="display:none;">
        <h3>Imported from</h3>
        <div id="sourcePhotos" style="display:flex; gap:0.5rem; flex-wrap:wrap;"></div>
      </div>

      <p id="sourceLine" style="display:none; color: var(--rc-muted); font-size: 0.85rem;"></p>

      <div id="ownerActions" style="display:flex; gap:0.5rem; margin-top: 1rem;">
        <a id="editLink" class="rc-btn-primary" href="#">Edit</a>
        <button type="button" id="deleteBtn" class="rc-btn-danger">Delete</button>
      </div>
    </div>
    <p id="errorBox" class="error" style="display:none;"></p>
  </main>

  <script>
    const SUPABASE_URL = "https://hhkxmuxcmjzvpjvctgqk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhoa3htdXhjbWp6dnBqdmN0Z3FrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczNTIzMjksImV4cCI6MjEwMjkyODMyOX0.ZnC7cGeydW2DDNZtwn1gUownpI2gWm1U2m2s_KQmXw0";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const params = new URLSearchParams(window.location.search);
    const recipeId = params.get("id");

    const errorBox = document.getElementById("errorBox");
    const recipeCard = document.getElementById("recipeCard");
    let shareToken = null;
    let currentUserId = null;
    let isRecipeOwner = false;
    let currentMainPhotoId = null;

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s || "";
      return div.innerHTML;
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = "block";
    }

    async function requireSession() {
      const { data: { session }, error } = await sb.auth.getSession();
      if (error || !session) {
        window.location.href = "index.html";
        throw new Error("Session expired - redirecting to sign in.");
      }
      return session;
    }

    async function loadRecipe(userId) {
      if (!recipeId) {
        showError("No recipe specified.");
        return;
      }

      // recipes-b28.3: no .eq("user_id", userId) here - recipes-b28.2's
      // RLS already lets any approved user SELECT any recipe, and this
      // page needs to be viewable for recipes you don't own (that's the
      // whole point of "All Recipes"). Ownership only gates the Edit/
      // Delete actions below, not visibility.
      const { data: recipe, error } = await sb.from("recipes").select("*").eq("id", recipeId).single();
      if (error || !recipe) {
        showError("Recipe not found.");
        return;
      }

      const isOwner = recipe.user_id === userId;
      isRecipeOwner = isOwner;
      currentMainPhotoId = recipe.main_photo_id;
      document.getElementById("ownerActions").style.display = isOwner ? "flex" : "none";
      document.getElementById("addPhotoForm").style.display = isOwner ? "block" : "none";

      document.getElementById("recipeTitle").textContent = recipe.title;
      RecipesNav.setBreadcrumbs([{ label: "Home", href: "index.html" }, { label: "Your Recipes", href: "app.html" }, { label: recipe.title }]);

      const { data: authorProfile } = await sb.from("profiles").select("first_name, last_name").eq("id", recipe.user_id).maybeSingle();
      const authorName = [authorProfile?.first_name, authorProfile?.last_name].filter(Boolean).join(" ") || "a family member";
      document.getElementById("recipeByline").textContent = `Added by ${authorName}`;
      document.getElementById("recipeDescription").textContent = recipe.description || "";
      document.getElementById("recipeDescription").style.display = recipe.description ? "block" : "none";

      if (recipe.significance) {
        document.getElementById("significanceSection").style.display = "block";
        document.getElementById("recipeSignificance").textContent = recipe.significance;
      }

      const metaParts = [];
      if (recipe.prep_minutes) metaParts.push(`<span><strong>${recipe.prep_minutes}</strong> min prep</span>`);
      if (recipe.cook_minutes) metaParts.push(`<span><strong>${recipe.cook_minutes}</strong> min cook</span>`);
      if (recipe.servings) metaParts.push(`<span><strong>${escapeHtml(recipe.servings)}</strong> servings</span>`);
      document.getElementById("recipeMeta").innerHTML = metaParts.join("");

      const ingredientsList = document.getElementById("ingredientsList");
      ingredientsList.innerHTML = (recipe.ingredients || []).map(i => {
        const parts = [i.quantity, i.unit, i.name].filter(Boolean);
        return `<li>${escapeHtml(parts.join(" "))}</li>`;
      }).join("") || "<li>No ingredients listed.</li>";

      const stepsList = document.getElementById("stepsList");
      stepsList.innerHTML = (recipe.instructions || []).map(s => `<li>${escapeHtml(s)}</li>`).join("") || "<li>No steps listed.</li>";

      if (recipe.notes) {
        document.getElementById("notesSection").style.display = "block";
        document.getElementById("recipeNotes").textContent = recipe.notes;
      }

      if (recipe.source_photo_paths && recipe.source_photo_paths.length > 0) {
        const signedUrls = await Promise.all(
          recipe.source_photo_paths.map(path => sb.storage.from("recipe-photos").createSignedUrl(path, 3600))
        );
        const thumbsHtml = signedUrls
          .map(({ data }) => data ? `<img src="${data.signedUrl}" alt="" style="max-width:120px; max-height:120px; border-radius:8px; object-fit:cover;">` : "")
          .join("");
        if (thumbsHtml) {
          document.getElementById("sourcePhotosSection").style.display = "block";
          document.getElementById("sourcePhotos").innerHTML = thumbsHtml;
        }
      }

      if (recipe.source_name || recipe.source_url) {
        const sourceLine = document.getElementById("sourceLine");
        sourceLine.style.display = "block";
        if (recipe.source_url) {
          sourceLine.innerHTML = `Source: <a href="${escapeHtml(recipe.source_url)}" target="_blank" rel="noopener">${escapeHtml(recipe.source_name || recipe.source_url)}</a>`;
        } else {
          sourceLine.textContent = `Source: ${recipe.source_name}`;
        }
      }

      shareToken = recipe.share_token;

      document.getElementById("editLink").href = `add-recipe.html?id=${recipe.id}`;

      const { data: recipeTags } = await sb.from("recipe_tags").select("tags(name)").eq("recipe_id", recipe.id);
      const tagNames = (recipeTags || []).map(rt => rt.tags?.name).filter(Boolean);
      document.getElementById("recipeTags").innerHTML = tagNames.map(t => `<span>${escapeHtml(t)}</span>`).join("");

      recipeCard.style.display = "block";

      await loadFinishedPhotos();
    }

    // recipes-022.3: finished-dish photos, multiple per recipe, each
    // with an optional description. Any approved user can see them
    // (matches recipe_photos' SELECT policy, same as recipes/tags
    // themselves post-b28.2); only the recipe owner can add/remove them.
    async function loadFinishedPhotos() {
      const grid = document.getElementById("finishedPhotosGrid");
      const empty = document.getElementById("finishedPhotosEmpty");

      const { data: photos, error } = await sb
        .from("recipe_photos")
        .select("id, storage_path, description")
        .eq("recipe_id", recipeId)
        .order("created_at", { ascending: true });

      if (error || !photos || photos.length === 0) {
        grid.innerHTML = "";
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      const signedUrls = await Promise.all(
        photos.map(p => sb.storage.from("recipe-photos").createSignedUrl(p.storage_path, 3600))
      );

      grid.innerHTML = photos.map((p, i) => {
        const url = signedUrls[i]?.data?.signedUrl;
        if (!url) return "";
        const isMain = p.id === currentMainPhotoId;
        return `
          <div class="rc-photo-item">
            <div class="rc-photo-img-wrap">
              <img src="${url}" alt="">
              ${isMain ? `<span class="rc-photo-main-badge">★ Main</span>` : ""}
            </div>
            ${p.description ? `<p class="rc-photo-caption">${escapeHtml(p.description)}</p>` : ""}
            ${isRecipeOwner ? `<button type="button" class="rc-photo-set-main" data-photo-id="${p.id}">${isMain ? "Unset as main" : "Set as main"}</button>` : ""}
            ${isRecipeOwner ? `<button type="button" class="rc-photo-delete" data-photo-id="${p.id}" data-storage-path="${escapeHtml(p.storage_path)}">Delete</button>` : ""}
          </div>
        `;
      }).join("");

      grid.querySelectorAll(".rc-photo-set-main").forEach(btn => {
        btn.addEventListener("click", async () => {
          const photoId = btn.dataset.photoId;
          const newMainId = currentMainPhotoId === photoId ? null : photoId;
          const { error } = await sb.from("recipes").update({ main_photo_id: newMainId }).eq("id", recipeId);
          if (error) {
            alert(error.message);
            return;
          }
          currentMainPhotoId = newMainId;
          await loadFinishedPhotos();
        });
      });

      grid.querySelectorAll(".rc-photo-delete").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("Delete this photo?")) return;
          const photoId = btn.dataset.photoId;
          const storagePath = btn.dataset.storagePath;
          await sb.storage.from("recipe-photos").remove([storagePath]);
          await sb.from("recipe_photos").delete().eq("id", photoId);
          if (currentMainPhotoId === photoId) currentMainPhotoId = null;
          await loadFinishedPhotos();
        });
      });
    }

    // Same resize as import.html - caps the long edge at Claude's
    // effective vision resolution; doesn't need Claude here, but keeps
    // uploads small/fast regardless.
    async function resizeImageForUpload(file, maxDimension = 1568, quality = 0.85) {
      if (!file.type.startsWith("image/") || file.type === "image/gif") return file;

      const imgBitmap = await createImageBitmap(file);
      const scale = Math.min(1, maxDimension / Math.max(imgBitmap.width, imgBitmap.height));
      if (scale === 1) return file;

      const targetW = Math.round(imgBitmap.width * scale);
      const targetH = Math.round(imgBitmap.height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = targetW;
      canvas.height = targetH;
      canvas.getContext("2d").drawImage(imgBitmap, 0, 0, targetW, targetH);

      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));
      if (!blob) return file;

      return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
    }

    document.getElementById("shareBtn").addEventListener("click", async () => {
      const shareUrl = `${window.location.origin}/shared-recipe.html?token=${shareToken}`;
      const shareStatus = document.getElementById("shareStatus");

      // Prefer the native share sheet on mobile; fall back to copying
      // the link to the clipboard on desktop or if the user cancels.
      if (navigator.share) {
        try {
          await navigator.share({ title: document.getElementById("recipeTitle").textContent, url: shareUrl });
          return;
        } catch {
          // user cancelled or share failed - fall through to clipboard
        }
      }

      try {
        await navigator.clipboard.writeText(shareUrl);
        shareStatus.textContent = "Link copied - anyone with it can view this recipe, no account needed.";
      } catch {
        shareStatus.textContent = shareUrl;
      }
      shareStatus.style.display = "block";
    });

    document.getElementById("addPhotoBtn").addEventListener("click", async () => {
      const fileInput = document.getElementById("newPhotoFile");
      const descInput = document.getElementById("newPhotoDescription");
      const addPhotoBtn = document.getElementById("addPhotoBtn");
      const photoUploadError = document.getElementById("photoUploadError");
      photoUploadError.style.display = "none";

      const file = fileInput.files[0];
      if (!file) {
        photoUploadError.textContent = "Choose a photo first.";
        photoUploadError.style.display = "block";
        return;
      }

      addPhotoBtn.disabled = true;
      addPhotoBtn.textContent = "Uploading…";

      try {
        const resized = await resizeImageForUpload(file);
        const storagePath = `${currentUserId}/finished/${recipeId}/${crypto.randomUUID()}-${resized.name}`;
        const { error: uploadError } = await sb.storage.from("recipe-photos").upload(storagePath, resized, { contentType: resized.type });
        if (uploadError) throw new Error(uploadError.message);

        const { error: insertError } = await sb.from("recipe_photos").insert({
          recipe_id: recipeId,
          storage_path: storagePath,
          description: descInput.value.trim() || null,
        });
        if (insertError) throw new Error(insertError.message);

        fileInput.value = "";
        descInput.value = "";
        await loadFinishedPhotos();
      } catch (err) {
        photoUploadError.textContent = err.message;
        photoUploadError.style.display = "block";
      }

      addPhotoBtn.disabled = false;
      addPhotoBtn.textContent = "Add photo";
    });

    document.getElementById("deleteBtn").addEventListener("click", async () => {
      if (!confirm("Delete this recipe? This can't be undone.")) return;
      const session = await requireSession();
      const { error } = await sb.from("recipes").delete().eq("id", recipeId).eq("user_id", session.user.id);
      if (error) {
        showError(error.message);
        return;
      }
      window.location.href = "app.html";
    });

    document.addEventListener("DOMContentLoaded", async () => {
      let session;
      try {
        session = await requireSession();
      } catch {
        return;
      }
      currentUserId = session.user.id;
      await RecipesNav.init({ sb, breadcrumbs: [{ label: "Home", href: "index.html" }, { label: "Your Recipes", href: "app.html" }, { label: "…" }] });
      await loadRecipe(currentUserId);
    });
  </script>
</body>
</html>
